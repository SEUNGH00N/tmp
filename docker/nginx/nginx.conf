worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  log_format upstreamlog '$remote_addr - $host [$time_local] "$request" '
                        '$status upstream=$upstream_addr upstream_status=$upstream_status '
                        'rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout upstreamlog;

  upstream admin_was_pool {
    server admin-was-green:8080 max_fails=3 fail_timeout=10s;
  }

  upstream user_was_pool {
    server user-was-green:8080 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 8080;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300;
      proxy_connect_timeout 10;
      proxy_pass http://user_was_pool;
    }
  }

  server {
    listen 8081;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300;
      proxy_connect_timeout 10;
      proxy_pass http://admin_was_pool;
    }
  }
}
