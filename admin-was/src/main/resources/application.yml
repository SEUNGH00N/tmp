server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: ADMINSESSION

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exceldb}
    username: ${SPRING_DATASOURCE_USERNAME:excel}
    password: ${SPRING_DATASOURCE_PASSWORD:excel}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  session:
    store-type: redis
    redis:
      namespace: admin-was:session
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  auth:
    token-ttl-seconds: 43200
  import:
    dispatch-mode: sync
    kafka:
      local-fallback-enabled: true
  storage:
    root: ./storage
    retention-days: 30

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
