server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/exceldb
    username: excel
    password: excel
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis

app:
  user-import:
    dispatch-mode: sync
    kafka:
      local-fallback-enabled: true
  storage:
    root: ./storage
