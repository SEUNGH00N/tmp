server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: USERSESSION

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exceldb}
    username: ${SPRING_DATASOURCE_USERNAME:excel}
    password: ${SPRING_DATASOURCE_PASSWORD:excel}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  session:
    store-type: redis
    redis:
      namespace: user-was:session

app:
  security:
    connection-key-version: 1
    connection-secret-base64: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
  user-import:
    dispatch-mode: sync
    kafka:
      local-fallback-enabled: true
  storage:
    root: ./storage

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
