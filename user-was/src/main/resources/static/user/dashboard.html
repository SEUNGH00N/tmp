<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="app" class="min-h-screen">
    <header class="bg-white border-b">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold">User Import Dashboard</h1>
          <p class="text-xs text-slate-500">Tenant: {{ tenantId }}</p>
        </div>
        <button @click="logout" class="text-sm px-3 py-1 border rounded">Change Tenant</button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-4">
      <section class="bg-white border rounded-xl p-4">
        <h2 class="font-semibold">Upload Excel/CSV</h2>
        <div class="mt-3 flex gap-2">
          <input ref="file" type="file" accept=".csv,.xlsx" class="border rounded-lg px-3 py-2 flex-1" />
          <button @click="upload" :disabled="uploading" class="px-4 py-2 bg-blue-600 text-white rounded-lg disabled:opacity-50">
            {{ uploading ? 'Uploading...' : 'Upload' }}
          </button>
        </div>
        <p class="text-sm mt-2" :class="uploadError ? 'text-red-600' : 'text-emerald-600'">{{ uploadMsg }}</p>
      </section>

      <section class="bg-white border rounded-xl overflow-hidden">
        <div class="px-4 py-3 border-b flex items-center justify-between">
          <h2 class="font-semibold">My Import Jobs</h2>
          <button @click="fetchJobs" class="px-3 py-1 border rounded text-sm">Refresh</button>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="text-left px-4 py-2">Job ID</th>
                <th class="text-left px-4 py-2">Status</th>
                <th class="text-left px-4 py-2">Progress</th>
                <th class="text-left px-4 py-2">Created</th>
                <th class="text-left px-4 py-2">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="j in jobs" :key="j.jobId" class="border-t">
                <td class="px-4 py-2 font-mono text-xs">{{ j.jobId }}</td>
                <td class="px-4 py-2">{{ j.status }}</td>
                <td class="px-4 py-2">{{ j.progressPct }}% ({{ j.processedRows }}/{{ j.totalRows }})</td>
                <td class="px-4 py-2">{{ fmt(j.createdAt) }}</td>
                <td class="px-4 py-2"><a :href="`/user/job-detail.html?jobId=${j.jobId}`" class="text-blue-600 hover:underline">View</a></td>
              </tr>
              <tr v-if="!jobs.length"><td colspan="5" class="px-4 py-6 text-center text-slate-500">No jobs</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/user/app.js"></script>
  <script>
    Vue.createApp({
      data() {
        return { tenantId: '', jobs: [], uploading: false, uploadMsg: '', uploadError: false };
      },
      async mounted() {
        this.tenantId = UserApp.requireTenant();
        if (!this.tenantId) return;
        await this.fetchJobs();
      },
      methods: {
        fmt(v) { return UserApp.fmt(v); },
        logout() { UserApp.clearTenant(); },
        async fetchJobs() {
          const res = await UserApp.api(`/api/v1/user/imports?tenant_id=${encodeURIComponent(this.tenantId)}&page=0&size=20`, { method: 'GET' });
          this.jobs = res.data.items || [];
        },
        async upload() {
          const file = this.$refs.file.files[0];
          if (!file) {
            this.uploadError = true;
            this.uploadMsg = 'file is required';
            return;
          }
          this.uploading = true;
          this.uploadMsg = '';
          try {
            const form = new FormData();
            form.append('tenant_id', this.tenantId);
            form.append('file', file);
            const res = await UserApp.api('/api/v1/user/imports', { method: 'POST', body: form });
            this.uploadError = false;
            this.uploadMsg = `created job: ${res.data.jobId}`;
            await this.fetchJobs();
          } catch (e) {
            this.uploadError = true;
            this.uploadMsg = e.message;
          } finally {
            this.uploading = false;
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
