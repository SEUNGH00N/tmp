<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">
  <div id="app" class="w-full max-w-sm bg-white rounded-xl shadow p-6">
    <h1 class="text-xl font-bold">User Portal</h1>
    <p class="text-sm text-slate-500 mt-1">Enter your tenant ID to continue</p>

    <form class="mt-4" @submit.prevent="go">
      <input v-model="tenantId" class="w-full border rounded-lg px-3 py-2" placeholder="Tenant UUID" required />
      <button class="w-full mt-3 bg-blue-600 text-white py-2 rounded-lg font-semibold">Continue</button>
      <p class="text-xs text-slate-500 mt-2">Example: 00000000-0000-0000-0000-000000000001</p>
    </form>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/user/app.js"></script>
  <script>
    Vue.createApp({
      data() { return { tenantId: UserApp.getTenantId() }; },
      methods: {
        go() {
          UserApp.setTenantId(this.tenantId.trim());
          window.location.href = '/user/dashboard.html';
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
