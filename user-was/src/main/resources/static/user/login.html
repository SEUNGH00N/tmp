<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login - Excel Import Service</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#ec5b13','bg-light':'#f8f6f6'},fontFamily:{display:['Public Sans']}}}}</script>
  <style> body { font-family: 'Public Sans', sans-serif; } </style>
</head>
<body class="min-h-screen bg-bg-light font-display">
  <div id="app" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border rounded-2xl shadow-xl p-8">
      <div class="flex items-center gap-3 mb-5"><div class="bg-primary rounded-lg p-2 text-white"><span class="material-symbols-outlined">person</span></div><div><h1 class="text-lg font-bold">User Portal</h1><p class="text-xs text-slate-500">Workspace access login</p></div></div>
      <form class="space-y-3" @submit.prevent="go"><input v-model="workspaceId" class="w-full rounded-xl border-slate-300 focus:border-primary focus:ring-primary" placeholder="Workspace UUID" required /><button class="w-full rounded-xl bg-primary text-white py-2.5 font-bold">Continue</button><p class="text-xs text-slate-500">Example: workspace UUID</p></form>
    </div>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/user/app.js"></script>
  <script>
    Vue.createApp({
      data(){return{workspaceId:UserApp.getWorkspaceId()};},
      methods:{
        async go(){
          const ws=this.workspaceId.trim();
          UserApp.setWorkspaceId(ws);
          await UserApp.bindWorkspaceSession(ws);
          window.location.href='/user/dashboard.html';
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
