<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Excel Import</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background: linear-gradient(120deg,#f8fafc,#e2e8f0); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { width: 360px; background:#fff; border-radius:12px; box-shadow:0 20px 35px rgba(0,0,0,.12); padding:28px; }
    h1 { margin:0 0 4px; font-size:24px; }
    p { margin:0 0 20px; color:#64748b; }
    label { display:block; font-size:13px; margin:12px 0 6px; color:#334155; }
    input { width:100%; box-sizing:border-box; padding:10px; border:1px solid #cbd5e1; border-radius:8px; }
    button { margin-top:16px; width:100%; border:0; background:#2563eb; color:#fff; padding:10px; border-radius:8px; font-weight:700; cursor:pointer; }
    .hint { margin-top:10px; font-size:12px; color:#64748b; }
    .msg { min-height:18px; margin-top:10px; font-size:13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Excel Import</h1>
    <p>Sign in to admin console</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" value="admin" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" value="admin1234" required />
      <button type="submit">Login</button>
      <div class="msg" id="message"></div>
    </form>
    <div class="hint">Default: admin / admin1234</div>
  </div>

  <script src="/mock/app.js"></script>
  <script>
    const messageEl = document.getElementById('message');

    app.ensureGuest();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      app.showMessage(messageEl, 'Signing in...');
      try {
        await app.api('/api/v1/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        window.location.href = '/mock/dashboard.html';
      } catch (err) {
        app.showMessage(messageEl, err.message, true);
      }
    });
  </script>
</body>
</html>
