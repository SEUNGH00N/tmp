<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Excel Import</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">
  <div id="app" class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6">
    <h1 class="text-2xl font-bold">Excel Import</h1>
    <p class="text-sm text-slate-500 mt-1">Sign in to continue</p>

    <form class="mt-5 space-y-3" @submit.prevent="submitLogin">
      <div>
        <label class="text-sm font-medium">Username</label>
        <input v-model="username" class="mt-1 w-full border rounded-lg px-3 py-2" required />
      </div>
      <div>
        <label class="text-sm font-medium">Password</label>
        <input v-model="password" type="password" class="mt-1 w-full border rounded-lg px-3 py-2" required />
      </div>
      <button :disabled="loading" class="w-full bg-blue-600 text-white rounded-lg py-2 font-semibold disabled:opacity-60">
        {{ loading ? 'Signing in...' : 'Login' }}
      </button>
      <p class="text-sm" :class="messageError ? 'text-red-600' : 'text-emerald-600'">{{ message }}</p>
    </form>

    <p class="text-xs text-slate-500 mt-2">Default: admin / admin1234</p>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/mock/app.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          username: 'admin',
          password: 'admin1234',
          loading: false,
          message: '',
          messageError: false
        };
      },
      async mounted() {
        await ExcelApp.ensureGuest();
      },
      methods: {
        async submitLogin() {
          this.loading = true;
          this.message = '';
          try {
            await ExcelApp.api('/api/v1/auth/login', {
              method: 'POST',
              body: JSON.stringify({ username: this.username, password: this.password })
            });
            window.location.href = '/mock/dashboard.html';
          } catch (e) {
            this.message = e.message;
            this.messageError = true;
          } finally {
            this.loading = false;
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
