<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Detail - Excel Import</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="app" class="min-h-screen">
    <header class="bg-white border-b">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold">Job Detail</h1>
        <button @click="logout" class="px-3 py-1.5 text-sm border rounded">Logout</button>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-4 grid grid-cols-12 gap-4">
      <aside class="col-span-12 md:col-span-3 bg-white border rounded-xl p-3">
        <nav class="space-y-1 text-sm font-medium">
          <a href="/mock/dashboard.html" class="block px-3 py-2 rounded hover:bg-slate-100">Dashboard</a>
          <a href="/mock/job-list.html" class="block px-3 py-2 rounded bg-blue-50 text-blue-700">Jobs</a>
          <a href="/mock/settings.html" class="block px-3 py-2 rounded hover:bg-slate-100">Settings</a>
        </nav>
      </aside>

      <main class="col-span-12 md:col-span-9 space-y-4">
        <section class="bg-white border rounded-xl p-4">
          <div class="flex gap-2 items-center">
            <input v-model="jobId" placeholder="Job UUID" class="flex-1 border rounded-lg px-3 py-2" />
            <button @click="loadAll" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Load</button>
          </div>
          <p class="mt-3 text-sm" :class="statusError ? 'text-red-600' : 'text-slate-700'">{{ statusText }}</p>
        </section>

        <section class="bg-white border rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b font-semibold">Errors</div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-slate-50 text-slate-600">
                <tr><th class="px-4 py-2 text-left">Row</th><th class="px-4 py-2 text-left">Column</th><th class="px-4 py-2 text-left">Code</th><th class="px-4 py-2 text-left">Message</th></tr>
              </thead>
              <tbody>
                <tr v-for="e in errors" :key="`${e.rowIndex}-${e.columnName}-${e.errorCode}`" class="border-t">
                  <td class="px-4 py-2">{{ e.rowIndex }}</td><td class="px-4 py-2">{{ e.columnName }}</td><td class="px-4 py-2">{{ e.errorCode }}</td><td class="px-4 py-2">{{ e.errorMsg }}</td>
                </tr>
                <tr v-if="!errors.length"><td colspan="4" class="px-4 py-6 text-center text-slate-500">No errors</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="bg-white border rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b font-semibold">Rows</div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-slate-50 text-slate-600">
                <tr><th class="px-4 py-2 text-left">Row ID</th><th class="px-4 py-2 text-left">Payload JSON</th><th class="px-4 py-2 text-left">Created</th></tr>
              </thead>
              <tbody>
                <tr v-for="r in rows" :key="r.id" class="border-t align-top">
                  <td class="px-4 py-2 font-mono text-xs">{{ r.id }}</td>
                  <td class="px-4 py-2"><pre class="whitespace-pre-wrap text-xs">{{ r.payloadJson }}</pre></td>
                  <td class="px-4 py-2">{{ fmt(r.createdAt) }}</td>
                </tr>
                <tr v-if="!rows.length"><td colspan="3" class="px-4 py-6 text-center text-slate-500">No rows</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/mock/app.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return { jobId: '', statusText: '', statusError: false, errors: [], rows: [] };
      },
      async mounted() {
        const auth = await ExcelApp.requireAuth();
        if (!auth) return;
        const params = new URLSearchParams(window.location.search);
        this.jobId = params.get('jobId') || '';
        if (this.jobId) await this.loadAll();
      },
      methods: {
        fmt(v) { return ExcelApp.formatDate(v); },
        async logout() { await ExcelApp.logout(); },
        async loadAll() {
          if (!this.jobId) return;
          this.statusError = false;
          try {
            const s = await ExcelApp.api(`/api/v1/imports/${this.jobId}`, { method: 'GET' });
            const d = s.data;
            this.statusText = `Status: ${d.status} | Progress: ${d.progressPct}% (${d.processedRows}/${d.totalRows})`;

            const e = await ExcelApp.api(`/api/v1/imports/${this.jobId}/errors?page=0&size=50&sort=createdAt,desc`, { method: 'GET' });
            this.errors = e.data.items || [];

            const r = await ExcelApp.api(`/api/v1/imports/${this.jobId}/rows?page=0&size=50&sort=createdAt,desc`, { method: 'GET' });
            this.rows = r.data.items || [];
          } catch (err) {
            this.statusError = true;
            this.statusText = err.message;
            this.errors = [];
            this.rows = [];
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
