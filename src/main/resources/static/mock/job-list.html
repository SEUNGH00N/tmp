<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job List - Excel Import</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="app" class="min-h-screen">
    <header class="bg-white border-b">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold">Import Jobs</h1>
        <button @click="logout" class="px-3 py-1.5 text-sm border rounded">Logout</button>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-4 grid grid-cols-12 gap-4">
      <aside class="col-span-12 md:col-span-3 bg-white border rounded-xl p-3">
        <nav class="space-y-1 text-sm font-medium">
          <a href="/mock/dashboard.html" class="block px-3 py-2 rounded hover:bg-slate-100">Dashboard</a>
          <a href="/mock/job-list.html" class="block px-3 py-2 rounded bg-blue-50 text-blue-700">Jobs</a>
          <a href="/mock/settings.html" class="block px-3 py-2 rounded hover:bg-slate-100">Settings</a>
        </nav>
      </aside>

      <main class="col-span-12 md:col-span-9 bg-white border rounded-xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="text-left px-4 py-2">Created</th>
                <th class="text-left px-4 py-2">Job ID</th>
                <th class="text-left px-4 py-2">Tenant</th>
                <th class="text-left px-4 py-2">Status</th>
                <th class="text-left px-4 py-2">Progress</th>
                <th class="text-left px-4 py-2">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="j in jobs" :key="j.jobId" class="border-t">
                <td class="px-4 py-2">{{ fmt(j.createdAt) }}</td>
                <td class="px-4 py-2 font-mono text-xs">{{ j.jobId }}</td>
                <td class="px-4 py-2">{{ j.tenantId }}</td>
                <td class="px-4 py-2">{{ j.status }}</td>
                <td class="px-4 py-2">{{ j.progressPct }}% ({{ j.processedRows }}/{{ j.totalRows }})</td>
                <td class="px-4 py-2"><a :href="`/mock/job-details.html?jobId=${j.jobId}`" class="text-blue-600 hover:underline">View</a></td>
              </tr>
              <tr v-if="!jobs.length"><td colspan="6" class="px-4 py-6 text-center text-slate-500">No jobs</td></tr>
            </tbody>
          </table>
        </div>

        <div class="px-4 py-3 border-t flex items-center justify-between text-sm">
          <div>Page {{ page + 1 }} / {{ Math.max(totalPages, 1) }}</div>
          <div class="space-x-2">
            <button @click="prev" :disabled="page===0" class="px-3 py-1 border rounded disabled:opacity-50">Prev</button>
            <button @click="next" :disabled="page+1>=totalPages" class="px-3 py-1 border rounded disabled:opacity-50">Next</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/mock/app.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return { jobs: [], page: 0, size: 20, totalPages: 0 };
      },
      async mounted() {
        const auth = await ExcelApp.requireAuth();
        if (!auth) return;
        await this.load();
      },
      methods: {
        fmt(v) { return ExcelApp.formatDate(v); },
        async logout() { await ExcelApp.logout(); },
        async load() {
          const res = await ExcelApp.api(`/api/v1/imports?page=${this.page}&size=${this.size}&sort=createdAt,desc`, { method: 'GET' });
          this.jobs = res.data.items || [];
          this.totalPages = res.data.totalPages || 0;
        },
        async prev() { if (this.page > 0) { this.page--; await this.load(); } },
        async next() { if (this.page + 1 < this.totalPages) { this.page++; await this.load(); } }
      }
    }).mount('#app');
  </script>
</body>
</html>
