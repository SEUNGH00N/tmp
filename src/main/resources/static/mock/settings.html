<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - Excel Import</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="app" class="min-h-screen">
    <header class="bg-white border-b">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold">Settings</h1>
        <button @click="logout" class="px-3 py-1.5 text-sm border rounded">Logout</button>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-4 grid grid-cols-12 gap-4">
      <aside class="col-span-12 md:col-span-3 bg-white border rounded-xl p-3">
        <nav class="space-y-1 text-sm font-medium">
          <a href="/mock/dashboard.html" class="block px-3 py-2 rounded hover:bg-slate-100">Dashboard</a>
          <a href="/mock/job-list.html" class="block px-3 py-2 rounded hover:bg-slate-100">Jobs</a>
          <a href="/mock/settings.html" class="block px-3 py-2 rounded bg-blue-50 text-blue-700">Settings</a>
        </nav>
      </aside>

      <main class="col-span-12 md:col-span-9 space-y-4">
        <section class="bg-white border rounded-xl p-4">
          <h2 class="font-semibold">Runtime Settings</h2>
          <div class="mt-3 grid md:grid-cols-2 gap-3">
            <div>
              <label class="text-sm font-medium">Storage Root</label>
              <input v-model="settings.storageRoot" class="mt-1 w-full border rounded-lg px-3 py-2" />
            </div>
            <div>
              <label class="text-sm font-medium">Retention Days</label>
              <input v-model.number="settings.retentionDays" type="number" min="1" class="mt-1 w-full border rounded-lg px-3 py-2" />
            </div>
          </div>
          <button @click="save" class="mt-3 px-4 py-2 bg-blue-600 text-white rounded-lg">Save</button>
          <p class="text-sm mt-2" :class="msgError ? 'text-red-600' : 'text-emerald-600'">{{ message }}</p>
        </section>

        <section class="bg-white border rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b font-semibold">Users</div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-slate-50 text-slate-600"><tr><th class="px-4 py-2 text-left">Username</th><th class="px-4 py-2 text-left">Display Name</th><th class="px-4 py-2 text-left">Active</th><th class="px-4 py-2 text-left">Created</th></tr></thead>
              <tbody>
                <tr v-for="u in users" :key="u.id" class="border-t">
                  <td class="px-4 py-2">{{ u.username }}</td>
                  <td class="px-4 py-2">{{ u.displayName }}</td>
                  <td class="px-4 py-2">{{ u.active }}</td>
                  <td class="px-4 py-2">{{ fmt(u.createdAt) }}</td>
                </tr>
                <tr v-if="!users.length"><td colspan="4" class="px-4 py-6 text-center text-slate-500">No users</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/mock/app.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          settings: { storageRoot: '', retentionDays: 30 },
          users: [],
          message: '',
          msgError: false
        };
      },
      async mounted() {
        const auth = await ExcelApp.requireAuth();
        if (!auth) return;
        await this.loadAll();
      },
      methods: {
        fmt(v) { return ExcelApp.formatDate(v); },
        async logout() { await ExcelApp.logout(); },
        async loadAll() {
          const s = await ExcelApp.api('/api/v1/settings', { method: 'GET' });
          this.settings = s.data;
          const u = await ExcelApp.api('/api/v1/users?page=0&size=20&sort=createdAt,desc', { method: 'GET' });
          this.users = u.data.items || [];
        },
        async save() {
          this.message = '';
          try {
            const res = await ExcelApp.api('/api/v1/settings', {
              method: 'PUT',
              body: JSON.stringify(this.settings)
            });
            this.settings = res.data;
            this.msgError = false;
            this.message = 'Saved';
          } catch (e) {
            this.msgError = true;
            this.message = e.message;
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
