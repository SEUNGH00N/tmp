services:
  postgres:
    image: postgres:15
    container_name: excel-import-postgres
    environment:
      POSTGRES_DB: exceldb
      POSTGRES_USER: excel
      POSTGRES_PASSWORD: excel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: excel-import-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
